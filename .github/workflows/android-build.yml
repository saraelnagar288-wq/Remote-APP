name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate Android project
        run: |
          test -f android/settings.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Run unit tests
        working-directory: android
        run: ./gradlew :app:test --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-connect-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build report
        if: always()
        run: |
          mkdir -p build-report
          {
            echo '# Mobile Connect Build Report'
            echo
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_RUN_ID"
            echo "Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo '## Android'
            echo '- compileSdk: 36'
            echo '- targetSdk: 36'
            echo '- minSdk: 26'
            echo '- JDK: 17'
          } > build-report/build-report.md

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-connect-build-report
          path: build-report/build-report.md
