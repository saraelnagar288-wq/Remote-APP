name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Mobile Connect APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate Android project
        working-directory: android
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/mobileconnect/app/MainActivity.kt
          echo "Android project files: OK"

      - name: Check Gradle
        working-directory: android
        run: gradle --version

      - name: Build Debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Run unit tests
        working-directory: android
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-connect-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build report
        if: always()
        run: |
          mkdir -p build-report
          {
            echo '# Mobile Connect Build Report'
            echo
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_RUN_ID"
            echo "Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo '## Configuration'
            echo '- compileSdk: 36'
            echo '- targetSdk: 36'
            echo '- minSdk: 26'
            echo '- JDK: 17'
            echo '- Gradle: 8.10.2'
            echo '- Android Build Tools: 36.0.0'
            echo
            echo '## APK'
            if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
              echo '- Status: BUILD SUCCESS'
              echo '- Path: android/app/build/outputs/apk/debug/app-debug.apk'
              echo "- Size: $(du -h android/app/build/outputs/apk/debug/app-debug.apk | cut -f1)"
            else
              echo '- Status: BUILD FAILED'
            fi
          } > build-report/build-report.md

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-connect-build-report
          path: build-report/build-report.md
